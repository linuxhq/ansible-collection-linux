---
bugfixes:
  - kopia_snapshot - report no change when kopia skips the snapshot because the
    policy sets ``retention.ignore_identical_snapshots`` and no files changed
    since the previous snapshot. The module reported a change and returned the
    previous snapshot as if it were new.
  - kopia_snapshot - return the snapshot the module created, identified by the
    ID kopia prints when it saves it. The module returned the newest snapshot
    listed for the path, which could be one created by a scheduled snapshot or
    another run in between.
  - kopia_snapshot - report a change and return the saved snapshot when kopia
    saves the snapshot but then fails because it found fatal errors while
    snapshotting, such as a file it cannot read. The module failed without a
    change or snapshot, so a retry took another snapshot.
