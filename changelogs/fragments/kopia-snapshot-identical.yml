---
bugfixes:
  - kopia_snapshot - report no change when kopia skips the snapshot because the
    policy sets ``retention.ignore_identical_snapshots`` and no files changed
    since the previous snapshot. The module reported a change and returned the
    previous snapshot as if it were new.
  - kopia_snapshot - return the snapshot the module created, identified by the
    ID kopia prints when it saves it. The module returned the newest snapshot
    listed for the path, which could be one created by a scheduled snapshot or
    another run in between.
  - kopia_snapshot - report a change and return the saved snapshot when kopia
    printed the snapshot it saved, then exited with an error, for example fatal
    errors found while snapshotting, such as a file it cannot read, or automatic
    maintenance failing afterwards. The module failed without a change or
    snapshot, so a retry took another snapshot. When kopia does not list the
    printed snapshot, for example because its final repository flush failed, the
    module still fails without a change, and when the snapshots cannot be
    listed, it reports a change, as the snapshot may have been saved, with an
    empty ``snapshot``.
  - kopia_snapshot - list the snapshots of a path in which an ``@`` comes before
    any ``:``, such as ``/home/alice@example.com``, by its source
    ``user@host:/path``. kopia reads such a bare path as ``user@host`` or
    ``user@host:path``, or rejects one with no ``:`` whose only ``@`` is its
    last character, so the module returned an empty ``snapshot``, and when kopia
    printed the snapshot it saved, then reported errors, the module failed
    without a change, so a retry took another snapshot. Other paths, including
    one with a ``:`` before its first ``@`` such as ``/srv/a:b@c``, which kopia
    reads as a path, are listed without a user and host, so a client user such
    as ``alice@corp.example.com`` keeps working. When the client user contains
    ``@`` or ``:``, or the host contains ``:``, which kopia cannot read in
    ``user@host:/path``, the module fails before taking a snapshot of a path in
    which an ``@`` comes before any ``:``.
  - kopia_snapshot, kopia_snapshot_info - pass ``path`` to kopia made absolute,
    so a relative path such as ``--all`` or ``(global)`` is no longer read as
    an option or as the global source.
  - kopia_snapshot_info - list the snapshots of a ``path`` in which an ``@``
    comes before any ``:`` by its source ``user@host:/path``, with the client
    user and host and the path made absolute and cleaned. kopia read such a bare
    path as ``user@host`` or ``user@host:path`` and returned no snapshots, or
    those of another source, or rejected it. Other paths, including one with a
    ``:`` before its first ``@``, are listed without a user and host. When the
    client user contains ``@`` or ``:``, or the host contains ``:``, the module
    fails for a path in which an ``@`` comes before any ``:``.
  - kopia_policy, kopia_policy_info - document that kopia stores the user, host
    and path of a ``user@host:/path`` target as given, so they must match the
    client user and host and an absolute, clean path, that kopia reads a
    target in which an ``@`` comes before any ``:`` as ``user@host`` or
    ``user@host:path``, except one that starts with ``@`` and contains ``:``,
    such as ``@host:/path``, which it reads as a relative directory path, and
    that no target can name a directory whose path is such a path when the
    client user contains ``@`` or ``:``, or the host contains ``:``.
  - kopia_policy_info - document that kopia makes a bare directory path
    ``target`` absolute and cleans it, as kopia_policy does.
