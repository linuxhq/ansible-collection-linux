---
breaking_changes:
  - kopia_repository_info role - publish ``_kopia_repository_info_connected``
    and ``_kopia_repository_info_repository``, named after the module's
    ``connected`` and ``repository`` return values, in place of
    ``_kopia_repository_info_dict``. ``_kopia_repository_info_connected`` is
    null when the module does not report ``connected``, as when kopia is
    unavailable in check mode.
  - kopia_maintenance_info role - publish
    ``_kopia_maintenance_info_maintenance``, named after the module's
    ``maintenance`` return value, in place of ``_kopia_maintenance_info_dict``.
  - kopia_snapshot_info role - publish ``_kopia_snapshot_info_snapshots``,
    named after the module's ``snapshots`` return value, in place of
    ``_kopia_snapshot_info_list``.
