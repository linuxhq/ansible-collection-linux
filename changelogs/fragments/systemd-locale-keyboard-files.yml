---
bugfixes:
  - systemd_locale - fail before writing any setting, also in check mode, when
    a keyboard request sent after another request, or converting the settings
    after writing its own file, would make systemd-localed rewrite
    ``/etc/vconsole.conf`` or, on Debian 12, ``/etc/default/keyboard`` while it
    contains a NUL byte or a setting that is not valid UTF-8.
    systemd-localed refuses to rewrite such a file, so the module applied
    ``locale`` and then failed, or reported a console keymap or a converted
    keyboard setting as changed although systemd-localed did not store it.
  - systemd_hostname, systemd_locale - read ``/etc/machine-info``,
    ``/etc/vconsole.conf`` and ``/etc/default/keyboard`` only when they are
    regular files, and otherwise as missing. Reading a FIFO there blocked the
    module, and a device such as ``/dev/zero`` never ended.
  - systemd_locale - document that systemd 253 and later also keep the X11
    keyboard settings in ``/etc/vconsole.conf`` and ignore a failure to write
    ``/etc/X11/xorg.conf.d/00-keyboard.conf``, which Debian 13 makes
    read-only for systemd-localed when the directory exists as systemd-localed
    starts. Clearing all of the X11 keyboard settings there is not kept either,
    as systemd-localed reports the settings in that file again once it
    restarts, as it does after exiting when idle, so such a task reports a
    change again on each run after systemd-localed restarts.
