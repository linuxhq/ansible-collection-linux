---
bugfixes:
  - systemd_locale - fail before writing any setting, also in check mode, when
    a keyboard change would make systemd-localed rewrite ``/etc/vconsole.conf``
    or, on Debian 12, ``/etc/default/keyboard`` while it contains a NUL byte or
    a setting that is not valid UTF-8. systemd-localed refuses to rewrite such
    a file, so the module applied ``locale`` and then failed, or reported a
    console keymap or a converted keyboard setting as changed although
    systemd-localed did not store it.
  - systemd_locale - document that systemd 253 and later also keep the X11
    keyboard settings in ``/etc/vconsole.conf`` and ignore a failure to write
    ``/etc/X11/xorg.conf.d/00-keyboard.conf``, which Debian 13 makes
    read-only for systemd-localed once the directory exists.
