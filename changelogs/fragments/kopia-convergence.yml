---
bugfixes:
  - kopia_repository - create a ``filesystem`` repository whose ``path`` does
    not exist yet, as ``kopia repository create`` does, instead of failing
    because connecting cannot access the missing path.
  - kopia_policy - fill a missing ``hour`` or ``min`` of a
    ``scheduling.time_of_day`` entry with ``0``, as kopia stores it, so such a
    policy no longer reports a change on every run.
  - kopia_maintenance - follow kopia when every stored log retention setting
    is zero, where kopia starts from its default log retention, so the result
    and check mode match the settings kopia stores. When one option clears
    every log retention setting partway through a command, a second run
    applies the rest.
  - kopia_maintenance - document that ``0`` for one ``max_retained_log_*``
    option means no limit on it, and that all three at ``0`` means kopia's
    default log retention applies.
  - kopia modules - document that ``config_file`` and the ``path`` options of
    ``kopia_snapshot`` and ``kopia_snapshot_info`` are expanded by Ansible.
