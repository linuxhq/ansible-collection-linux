---
bugfixes:
  - kopia_repository_info, kopia_maintenance, kopia_maintenance_info,
    kopia_policy, kopia_policy_info, kopia_snapshot, kopia_snapshot_info -
    give kopia ``/dev/null`` as its standard input. When the repository
    password was neither given nor persisted next to the configuration file,
    such as for a connection made with ``persist_credentials`` set to ``false``, kopia asked
    for it on the standard input it inherited, which is a terminal over SSH
    without pipelining, so the task waited forever, also in check mode. The
    module now fails saying that kopia needs the password, which is not given
    and not persisted next to the configuration file it names.
  - kopia_repository, kopia_snapshot, kopia_snapshot_info - fail before
    running kopia, also in check mode, for an empty ``password``. kopia reads
    an empty ``KOPIA_PASSWORD`` as no password, so it used a persisted
    password or asked for one, and ``kopia_repository`` created the storage
    directory before waiting for the password.
  - kopia_repository, kopia_repository_info, kopia_maintenance,
    kopia_maintenance_info, kopia_policy, kopia_policy_info, kopia_snapshot,
    kopia_snapshot_info - fail before running kopia, also in check mode, when
    ``config_file``, or kopia's default configuration file when it is unset,
    exists and is not a regular file, such as a directory or a FIFO, on which
    kopia waited forever even with a password.
  - kopia_repository, kopia_repository_info, kopia_maintenance,
    kopia_maintenance_info, kopia_policy, kopia_policy_info, kopia_snapshot,
    kopia_snapshot_info - run kopia with ``KOPIA_REPO_UPGRADE_NO_BLOCK=true``,
    so kopia fails while another client upgrades the repository format
    instead of waiting for the upgrade to end, which made the task wait for
    as long as the upgrade lock was held. kopia 0.12.0 and later read this
    variable, and earlier versions ignore it.
  - kopia_repository, kopia_repository_info, kopia_maintenance,
    kopia_maintenance_info, kopia_policy, kopia_policy_info, kopia_snapshot,
    kopia_snapshot_info - fail before running kopia, also in check mode, when
    a value passed to kopia contains a NUL character, or when ``config_file``
    or ``password`` contains a lone surrogate code point other than U+DC80 to
    U+DCFF. Such a value made the module fail with a traceback. U+DC80 to
    U+DCFF in ``config_file`` and ``password``, which Ansible uses for bytes
    that are not valid UTF-8, still reach kopia as those bytes.
  - kopia_policy, kopia_policy_info - fail before running kopia, also in check
    mode, for a ``target`` with no ``:`` whose only ``@`` is its last
    character, such as ``/srv/backup@``, which kopia rejects as an invalid
    host name, and document that such a directory is written as
    ``user@host:/path``. The documentation said that kopia reads such a target
    as ``user@host``.
  - kopia_snapshot, kopia_snapshot_info - document that kopia rejects a bare
    path with no ``:`` whose only ``@`` is its last character, such as
    ``/srv/backup@``, which the modules list by its source
    ``user@host:/path``. The documentation said that kopia reads it as
    ``user@host``.
  - kopia_repository_info, kopia_policy_info - leave out ``connected`` and
    ``defined`` in check mode when kopia is unavailable, as when the module
    fails, since they are unknown. They were returned as ``false``.
  - kopia_repository, kopia_repository_info, kopia_maintenance,
    kopia_maintenance_info, kopia_policy, kopia_policy_info, kopia_snapshot,
    kopia_snapshot_info - document that kopia looks up a bare ``config_file``
    name in its configuration directory, not in the working directory, and
    that the result keys are not returned when Ansible rejects the arguments,
    such as a missing required option or an invalid choice.
  - kopia_repository - document that with ``storage=sftp`` and ``external``
    set, ``ssh`` asks for a password, a passphrase or an unknown host key on
    the terminal, so the module can still wait for an answer.
