---
bugfixes:
  - kopia_repository_info, kopia_maintenance, kopia_maintenance_info,
    kopia_policy, kopia_policy_info, kopia_snapshot, kopia_snapshot_info -
    give kopia ``/dev/null`` as its standard input, also when the module runs
    with its standard input closed. When the repository password was neither
    given nor persisted next to the configuration file, such as for a
    connection made with ``persist_credentials`` set to ``false``, kopia asked
    for it on the standard input it inherited, which is a terminal over SSH
    without pipelining, so the task waited forever, also in check mode. The
    module now fails saying that kopia needs the password, which is not given
    and not persisted next to the configuration file it names.
  - kopia_repository - fail before running kopia, also in check mode, for an
    empty ``password`` when the host is not connected and the storage is
    ``sftp``, or ``filesystem`` with a ``path`` that does not exist. kopia
    reads an empty ``KOPIA_PASSWORD`` as no password, and that storage
    created the missing path before kopia waited for one. Elsewhere kopia
    fails to read the password before it changes anything.
  - kopia_repository, kopia_snapshot, kopia_snapshot_info - document that
    kopia removes whitespace around a given password, so a password of only
    whitespace is used as an empty password, which ``kopia repository create``
    accepts, without falling back to the persisted one, and that
    ``kopia_snapshot`` and ``kopia_snapshot_info`` read the persisted password
    for an empty one, as when it is not given.
  - kopia_repository_info, kopia_maintenance, kopia_maintenance_info,
    kopia_policy, kopia_policy_info, kopia_snapshot, kopia_snapshot_info - run
    kopia with ``KOPIA_REPO_UPGRADE_NO_BLOCK=true``, so kopia fails while
    another client upgrades the repository format instead of waiting for the
    upgrade to end, which made the task wait for as long as the upgrade lock
    was held. kopia 0.12.0 and later read this variable, and earlier versions
    ignore it. ``kopia repository connect`` ignores it, so kopia_repository
    still waits when it connects, which its documentation now says.
  - kopia_repository, kopia_repository_info, kopia_maintenance,
    kopia_maintenance_info, kopia_policy, kopia_policy_info, kopia_snapshot,
    kopia_snapshot_info - fail before running kopia, also in check mode, when
    ``config_file`` or another value passed to kopia as an argument contains
    a lone surrogate code point from U+D800 to U+DC7F. Such a value made the module fail with a traceback.
    U+DC80 to U+DCFF, which Ansible uses for bytes that are not valid UTF-8,
    still reach kopia as those bytes, and failure messages show such
    characters, also in kopia's own messages, as escapes, so they stay valid
    UTF-8.
  - kopia_policy, kopia_policy_info - document that kopia rejects a
    ``target`` with no ``:`` whose only ``@`` is its last character, such as
    ``/srv/backup@``, as an invalid host name before it changes anything, and
    that such a directory is written as ``user@host:/path``. The
    documentation said that kopia reads such a target as ``user@host``.
  - kopia_snapshot, kopia_snapshot_info - document that kopia rejects a bare
    path with no ``:`` whose only ``@`` is its last character, such as
    ``/srv/backup@``, which the modules list by its source
    ``user@host:/path``. The documentation said that kopia reads it as
    ``user@host``.
  - kopia_repository_info, kopia_policy_info - leave out ``connected`` and
    ``defined`` in check mode when kopia is unavailable, as when the module
    fails, since they are unknown. They were returned as ``false``.
  - kopia_repository, kopia_repository_info, kopia_maintenance,
    kopia_maintenance_info, kopia_policy, kopia_policy_info, kopia_snapshot,
    kopia_snapshot_info - document that kopia looks up a bare ``config_file``
    name in its configuration directory, not in the working directory, and
    that the result keys are not returned when Ansible rejects the arguments,
    such as a missing required option or an invalid choice, or fails to log
    them, such as for a lone surrogate code point in an option that is not
    secret, or when kopia cannot be started, such as for a NUL character in a
    value passed to it.
  - kopia_repository - document that with ``storage=sftp`` and ``external``
    set, ``ssh`` asks for a password, a passphrase or an unknown host key on
    the terminal, so the module can still wait for an answer.
