---
bugfixes:
  - kopia_snapshot, kopia_snapshot_info - refuse a ``path`` that is not
    valid UTF-8, such as one with a lone surrogate code point, before kopia
    runs, also in check mode. Ansible cannot run a task with such a path.
    A lone surrogate from U+D800 to U+DC7F made the module fail with a
    traceback. U+DC80 to U+DCFF, which Ansible uses for bytes that are not
    valid UTF-8, were passed to kopia as those bytes. Without ``no_log``, the
    module fails while Ansible logs its arguments. With ``no_log``, kopia
    saved the snapshot, and the controller then rejected the module result,
    which echoes the path, so the task failed without reporting the change.
