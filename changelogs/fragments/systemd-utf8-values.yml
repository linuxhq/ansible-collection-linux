---
bugfixes:
  - systemd_locale - fail before any setting is written, also in check mode,
    when a locale or keyboard value is not valid UTF-8, such as one with a
    lone surrogate code point, or contains a NUL character, or a keyboard
    value contains a Unicode noncharacter. A keyboard value that was not
    valid UTF-8 failed with a traceback after the locale was written, and one
    with a noncharacter failed with a D-Bus error after the locale was
    written. A value with a NUL character was cut at the NUL, so a different
    value was written and the task reported a change on every run.
  - systemd_timedate - fail before any setting is written, also in check mode,
    when ``time`` or ``timezone`` is not valid UTF-8 or contains a NUL
    character. A value that was not valid UTF-8 failed with a traceback, and
    a ``timezone`` with a NUL character was cut at the NUL, so a different
    value was written and the task reported a change on every run.
  - systemd_hostname - refuse ``static_hostname``, ``icon_name``,
    ``location`` and ``pretty_hostname`` values holding escaped bytes, such
    as ``\udcc3\udca9``, or a NUL character before any setting is written,
    because such a value cannot be sent to ``systemd-hostnamed`` or would be
    cut at the NUL.
