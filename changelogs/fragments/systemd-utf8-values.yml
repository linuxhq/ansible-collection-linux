---
bugfixes:
  - systemd_locale - fail before any setting is written, also in check mode,
    when a locale or keyboard value is not valid UTF-8, such as one with a
    lone surrogate code point, or contains a NUL character, or a keyboard
    value sent after another request contains a Unicode noncharacter. A
    keyboard value that was not
    valid UTF-8 failed with a traceback after the locale was written, and one
    with a noncharacter failed with a D-Bus error after the locale was
    written. A value with a NUL character was cut at the NUL, so a different
    value was written and the task reported a change on every run.
  - systemd_timedate - fail before any setting is written, also in check mode,
    when ``timezone`` is not valid UTF-8 or contains a NUL character, or
    ``time`` contains a lone surrogate code point from U+D800 to U+DC7F,
    which cannot be passed to ``systemd-analyze``. A value that was not valid
    UTF-8 failed with a traceback, and a ``timezone`` with a NUL character was
    cut at the NUL, so a different value was written and the task reported a
    change on every run.
  - systemd_hostname - refuse ``deployment``, ``icon_name``, ``location``,
    ``pretty_hostname``, ``static_hostname`` and ``transient_hostname``
    values holding escaped bytes, such as ``\udcc3\udca9``, or a NUL
    character before any setting is written, because such a value cannot be
    sent to ``systemd-hostnamed`` or would be cut at the NUL.
