---
minor_changes:
  - kopia role - pass ``kopia_repository.storage`` to kopia_repository as
    given, and skip the repository task when ``kopia_repository`` has no
    ``storage``, instead of failing with a missing required argument. Leave out
    ``validate_provider`` when ``kopia_repository.validate_provider`` is not
    set, so the module's default applies, instead of forcing ``false``.
