---
bugfixes:
  - rclone_config_encryption - reject a ``password`` containing a character
    that is unassigned in the Unicode tables of the managed node's Python,
    which rclone may NFKC normalize differently and then fail to decrypt the
    file. Such passwords were accepted before and are now refused with
    ``state=present`` before anything is read or written. With
    ``state=absent``, which only decrypts, they are still accepted.
