---
bugfixes:
  - systemd_locale - send ``systemd-localed`` only the requested locale
    variables that differ from the configured ones, together with a set
    ``language`` when ``lang`` changes. An unchanged ``lang`` sent with another
    change made ``systemd-localed`` replace a configured ``LANGUAGE`` with the
    value from its language fallback map, such as ``en_AU:en_GB`` for
    ``en_AU``, while check mode reported ``LANGUAGE`` unchanged.
  - systemd_locale - predict in check mode the ``LANGUAGE`` that
    ``systemd-localed`` sets from its language fallback map,
    ``/usr/share/systemd/language-fallback-map``, when ``lang`` changes
    without a set ``language``. Check mode reported the configured
    ``LANGUAGE`` instead. The map is read line by line as ``systemd-localed``
    reads it, with quotes removed, backslash escapes, a NUL ending a line,
    and no fallback after a line it cannot read or split, such as one of
    1 MiB or more or one with an unbalanced quote. Bytes in the map that are
    not valid UTF-8 are predicted as U+FFFD. A real run does not read the map
    and returns the locale ``systemd-localed`` reports.
  - systemd_locale - document that ``systemd-localed`` writes the fallback
    ``LANGUAGE`` without validating it, so it can be a list such as
    ``en_AU:en_GB``, which ``locale.language`` cannot set again where
    ``systemd-localed`` refuses a list, from systemd 256 everywhere and from
    systemd 246 where it checks that each locale is installed, as on EL, and
    that the returned ``language`` then cannot be fed back where it differs
    from the configured one.
  - systemd_locale - document that a set ``language`` is kept unless it equals
    the resulting ``LANG``, that an empty ``language`` counts as not set, and
    that ``systemd-localed`` drops any variable equal to the resulting
    ``LANG``, the requested or the configured one.
  - systemd_hostname_info, systemd_locale_info, systemd_timedate_info -
    document that the returned settings are empty, and ``timezones`` an empty
    list, when dasbus is unavailable in check mode.
  - systemd_hostname - document that ``transient_hostname`` cannot be combined
    with changing ``static_hostname`` to a value containing the ``?`` wildcard
    or a ``$`` token.
