---
breaking_changes:
  - systemd - the ``systemd_hostnamectl``, ``systemd_localectl`` and
    ``systemd_timedatectl`` variables have been removed. The settings they drove
    now live in the dedicated ``systemd_hostname``, ``systemd_locale`` and
    ``systemd_timedate`` roles, which call the matching modules over the system
    bus and report changes accurately, rather than running ``hostnamectl``,
    ``localectl`` and ``timedatectl`` with ``changed_when`` pinned to false.
minor_changes:
  - systemd_hostname - new role to manage the systemd hostname settings.
  - systemd_hostname_info - new role to gather the systemd hostname settings.
  - systemd_locale - new role to manage the systemd locale and keyboard settings.
  - systemd_locale_info - new role to gather the systemd locale and keyboard
    settings.
  - systemd_timedate - new role to manage the systemd time and date settings.
  - systemd_timedate_info - new role to gather the systemd time and date
    settings.
...
