---
bugfixes:
  - systemd_locale - send only the requested locale variables to
    systemd-localed, which merges them into the configured ones, so a
    configured variable it refuses, such as a ``LANGUAGE`` list like
    ``en_US:en``, no longer makes every later locale change fail.
  - systemd_locale - document that systemd 256 and later refuse ``:`` in
    ``locale.language``.
breaking_changes:
  - systemd_locale - requires systemd 239 or later, the first version whose
    systemd-localed merges a partial locale request instead of clearing the
    variables left out.
