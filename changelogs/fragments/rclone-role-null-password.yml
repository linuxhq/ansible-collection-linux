---
bugfixes:
  - rclone role - omit ``password`` when ``rclone_config_pass`` is ``null``,
    the default, instead of passing an empty string on ansible-core 2.18, so
    the configuration is written unencrypted rather than failing with
    ``no characters in password`` after the earlier tasks have run.
  - kopia_policy_info, kopia_snapshot_info and kopia_maintenance_info roles -
    omit options whose role default is ``null`` instead of passing an empty
    string on ansible-core 2.18. With the default inputs, kopia_policy_info
    ran ``kopia policy show`` for an empty target instead of listing the
    policies, and kopia_snapshot_info set an empty ``KOPIA_PASSWORD``.
