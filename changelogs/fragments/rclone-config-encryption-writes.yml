---
security_fixes:
  - rclone_config_encryption - create a new configuration file with mode
    ``0600`` from the start, instead of leaving it readable by other users
    between the move into place and setting its mode.
bugfixes:
  - rclone_config_encryption - honor ``unsafe_writes`` when writing the
    configuration file, including when no temporary file can be created in
    its directory, where the file is then written in place.
  - rclone_config_encryption - treat only the whitespace Go trims, as rclone
    does, as whitespace when reading the encryption header.
  - rclone_config_encryption, rclone_obscure, rclone_deobscure - document the
    minimum pycryptodome or pycryptodomex version, 3.7.0.
  - rclone_config_encryption - read the lines before the encryption header in
    pieces of 4096 bytes, as rclone does, so a comment longer than that before
    ``RCLONE_ENCRYPT_V0:`` no longer makes the module treat a file rclone reads
    as plain text as already encrypted.
