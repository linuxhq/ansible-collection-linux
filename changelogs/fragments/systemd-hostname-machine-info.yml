---
bugfixes:
  - systemd_hostname - compare ``chassis``, ``deployment``, ``icon_name``,
    ``location`` and ``pretty_hostname`` against ``/etc/machine-info`` instead
    of the computed D-Bus properties, so an empty ``icon_name`` no longer
    reports a change on every run and a ``chassis`` that matches the detected
    fallback is written to the file.
  - systemd_hostname - check a ``deployment``, ``icon_name``, ``location``,
    ``pretty_hostname`` or ``transient_hostname`` that is written after
    another setting before writing any setting, so an invalid value fails
    without leaving earlier settings applied. The first setting written is
    left to ``systemd-hostnamed``, which refuses an invalid value before
    anything is changed, and a stored value that is not written, such as an
    icon name stored before an upgrade to a systemd that refuses it, is not
    checked.
  - systemd_hostname - compare ``static_hostname`` against ``/etc/hostname``
    instead of the reported static hostname, so a hostname with ``?``
    wildcards, which systemd 258 and later substitute, no longer reports a
    change on every run.
  - systemd_hostname - predict the static hostname and ``hostname_source`` in
    check mode when ``static_hostname`` is set together with an empty
    ``transient_hostname``.
