---
bugfixes:
  - systemd_hostname, systemd_locale - read ``/etc/hostname`` and the
    language fallback map line by line exactly as the running systemd reads
    them. systemd 240 and later read ``\r\n``, ``\n\r``, ``\r\0`` and
    ``\n\r\0`` as one line end. systemd 239 ends a line only at a line feed
    or a NUL, and ``systemd-localed`` 239 reads the map with ``fgets()``, so a
    carriage return separates fields there, a NUL ends only the text of a
    line and a long line is read in pieces of 2047 bytes. The module read
    every systemd version as 240 and later reads.
  - systemd_hostname - read ``/etc/hostname`` on systemd 239 as it cleans a
    hostname up, keeping ``_`` and every ``-`` and shortening the line to 64
    bytes first, so a stored hostname such as ``my_host`` is no longer read
    as no static hostname.
  - systemd_hostname - read an ``/etc/hostname`` that cannot be read, such
    as a symbolic link loop or one that fails with an I/O error, as no static
    hostname, as ``systemd-hostnamed`` 246 and later do, instead of failing.
    One the module may not access still fails the task, as
    ``systemd-hostnamed`` runs as root and reads it. Document that systemd
    239 to 245 fail to start
    ``systemd-hostnamed`` on any error reading ``/etc/hostname`` other than a
    missing file, including a first hostname line left empty once invalid
    characters are removed, and read the file only when
    ``systemd-hostnamed`` starts.
  - systemd_locale - fail in check mode when the language fallback map may
    not be read, as ``systemd-localed`` runs as root and reads it, instead of
    predicting no fallback.
