---
bugfixes:
  - kopia_maintenance, kopia_maintenance_info, kopia_policy,
    kopia_policy_info, kopia_repository, kopia_repository_info,
    kopia_snapshot, kopia_snapshot_info, systemd_hostname,
    systemd_hostname_info, systemd_locale, systemd_locale_info,
    systemd_timedate, systemd_timedate_info - document the fields of nested
    return values with ``contains``, noting the fields kopia passes through
    unchanged.
  - kopia_maintenance, kopia_maintenance_info - document that kopia reports
    ``maintenance.extend_object_locks`` from kopia 0.14.0 and
    ``maintenance.list_parallelism`` from kopia 0.18.0.
  - kopia_snapshot, kopia_snapshot_info, kopia_maintenance,
    kopia_maintenance_info, kopia_repository, kopia_repository_info - correct
    the return samples to match kopia's output, with 32-digit snapshot IDs,
    64-digit repository IDs, UTC timestamps with nanoseconds, the snapshot
    ``source`` and the maintenance ``schedule.runs``.
  - kopia_repository_info - document that for a repository the host reaches
    through a kopia repository server, kopia reports an empty
    ``repository.storage.type`` and ``repository.unique_id_hex``, a null
    ``repository.storage.config``, and no ``repository.content_format.hash``,
    ``repository.content_format.encryption``,
    ``repository.content_format.version`` or
    ``repository.object_format.splitter``.
