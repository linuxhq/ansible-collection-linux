---
bugfixes:
  - systemd_hostname - write ``static_hostname`` before the other settings, so
    a value the running systemd refuses, such as a ``?`` wildcard before
    systemd 258, fails before anything is changed.
  - systemd_hostname - read ``/etc/machine-info`` exactly as systemd does, so
    values with an apostrophe or quote inside, such as ``Taylor's Laptop``,
    quoted parts, trailing non-breaking spaces and continuation lines no
    longer report a change on every run.
  - systemd_hostname - read ``/etc/machine-info`` as storing no settings when
    it contains a NUL byte, and stop reading it at the first setting that is
    not valid UTF-8, as systemd does. The module replaced such bytes and kept
    reading, so a setting systemd ignores was compared as stored and reported
    no change while systemd-hostnamed reported its fallback.
  - systemd_hostname - read ``/etc/hostname`` line by line as systemd does,
    so a line of 1 MiB or more before the hostname, which makes
    ``systemd-hostnamed`` ignore the file, reads as no static hostname. The
    module read a later hostname line instead and reported no change where
    ``systemd-hostnamed`` would write it. A file that is not a regular file,
    such as a directory or a FIFO, also reads as no static hostname instead of
    failing or blocking.
  - systemd_hostname - fail before writing any setting, also in check mode,
    when ``chassis``, ``deployment``, ``icon_name``, ``location`` or
    ``pretty_hostname`` would change and ``/etc/machine-info`` contains a NUL
    byte or a setting that is not valid UTF-8, which systemd-hostnamed refuses
    to rewrite. The module wrote ``static_hostname`` first, then failed with
    ``Invalid argument`` or ``Bad message``, and check mode predicted success.
  - systemd_hostname - reject an ``icon_name``, ``location`` or
    ``pretty_hostname`` containing a Unicode noncharacter, such as U+FDD0,
    which the system bus refuses, before writing any setting. The module wrote
    ``static_hostname`` first, then failed with ``Bad message``.
  - systemd_hostname - reject an ``icon_name`` containing ``\``, a quote, ``*``,
    ``?`` or ``[``, which systemd 262 and later refuse, before writing any
    setting.
  - systemd_hostname - document that ``?`` wildcards and ``$`` tokens in
    ``transient_hostname``, and ``$`` tokens in ``static_hostname``, are not
    accepted.
  - systemd_hostname_info, systemd_locale_info, systemd_timedate_info,
    systemd_hostname, systemd_locale, systemd_timedate - fail with a clear
    message instead of a GLib error when the system bus cannot be reached.
  - systemd_locale - document that a console keymap or X11 layout refused by
    systemd-localed is reported after the earlier settings are applied.
  - systemd_timedate - document that systemd 258 and later refuse a ``time``
    before the systemd build date only after the earlier settings are applied.
