---
bugfixes:
  - rclone_config_encryption - fail before any file is read or written when
    ``path`` contains a NUL character or a lone surrogate code point other
    than U+DC80 to U+DCFF, which cannot name a file. With ``content`` set,
    the module failed with a traceback; without it, it failed saying the
    configuration file does not exist. U+DC80 to U+DCFF, which Ansible uses
    for bytes that are not valid UTF-8, still stand for those bytes.
