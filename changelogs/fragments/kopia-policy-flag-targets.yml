---
bugfixes:
  - kopia_policy, kopia_policy_info - pass ``target`` to ``kopia policy
    export``, ``show`` and ``delete`` after ``--``. These commands read a
    target starting with ``-`` as a command-line flag, so ``state=absent``
    with ``target=--global`` deleted the global policy, and ``state=present``
    imported a policy for a relative path while comparing against the global
    policy, reporting a change on every run. Such a target is now read as
    ``kopia policy import`` reads it, as a relative path, or as ``user@host``
    or ``user@host:/path`` for a client user starting with ``-``.
  - kopia_policy, kopia_policy_info - fail before running kopia, also in check
    mode, when ``target`` is 32 lowercase hexadecimal digits. ``kopia policy
    export``, ``show`` and ``delete`` read such a target as a manifest ID,
    such as that of another policy or of a snapshot, so ``state=absent`` with
    a snapshot ID deleted the policy of the snapshot's source,
    ``state=present`` imported a policy for a relative path every run, and
    ``kopia_policy_info`` returned the policy of another target.
  - kopia_snapshot, kopia_snapshot_info - pass the source to ``kopia snapshot
    list`` after ``--``, so a path listed as ``user@host:/path`` for a client
    user starting with ``-`` is listed instead of being read as a flag, which
    made ``kopia_snapshot`` return an empty ``snapshot`` after taking it and
    ``kopia_snapshot_info`` fail.
  - kopia_repository, kopia_policy, kopia_maintenance - report ``changed``
    when kopia fails after the repository was connected or created, the policy
    imported or the maintenance settings set, such as when validating the
    provider or reading the result back fails.
  - kopia_repository - report ``changed`` when ``kopia repository create``
    fails after initializing the storage, when connecting to the new
    repository or setting its default global policy and maintenance owner
    fails, and say that this setup is not retried by a later run, which
    connects to the repository, or finds it connected, without it.
  - kopia_repository - read the connection status when ``kopia repository
    connect`` fails, and report ``changed`` when the host is connected, such
    as when kopia saved the connection and then failed to persist the
    password, or when the status cannot be read, as kopia may have saved the
    connection. The module reports no change only when kopia reports that the
    repository is not connected. It reported no change for every failed
    connect.
  - kopia_repository - report ``changed`` when ``kopia repository create``
    fails to write the format blob after writing the ``kopia.blobcfg`` blob,
    stored as the file ``kopia.blobcfg.f`` with ``filesystem``, ``rclone``,
    ``sftp`` or ``webdav`` storage, and say that this blob must be removed
    from the storage before the repository can be created. The module
    reported no change, and later runs failed with ``found existing data in
    storage location``, which now also says that the storage holds data but
    no kopia repository, such as that blob.
  - kopia_repository - report ``changed`` when ``kopia repository create``
    fails after creating the missing ``path`` directory of ``filesystem``
    storage, such as when writing the ``kopia.blobcfg`` blob fails for lack
    of space, and say that kopia created the directory.
  - kopia_repository, kopia_policy, kopia_maintenance, kopia_snapshot - return
    an empty ``repository``, ``policy``, ``maintenance`` or ``snapshot`` when
    the module fails, also before any change, such as when reading the current
    state fails, the host is connected to a different repository or an option
    is refused before kopia runs, instead of leaving the key out, and document
    it. The key is still left out when the kopia command is not found.
  - kopia_repository_info, kopia_maintenance_info, kopia_policy_info,
    kopia_snapshot_info - return an empty ``repository``, ``maintenance``,
    ``policy`` and ``effective_policy``, ``policies`` or ``snapshots`` when the
    module fails, such as when kopia fails or an option is refused before
    kopia runs, instead of leaving the key out, and document that
    ``connected`` and ``defined`` are left out then.
