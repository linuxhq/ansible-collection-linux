---
bugfixes:
  - rclone_config_encryption - document under ``content`` that a file whose
    first line other than blank and comment lines, trimmed of whitespace,
    starts with ``RCLONE_ENCRYPT_V`` but is not exactly
    ``RCLONE_ENCRYPT_V0:``, such as an ``RCLONE_ENCRYPT_V1:`` header or a
    damaged ``RCLONE_ENCRYPT_V0:`` line with the payload on it, fails even
    when ``content`` is set, and that, like rclone, the module trims the
    Unicode space characters rclone trims and reads lines in pieces of up to
    4096 bytes, so a longer line counts as several. The failure message now
    calls it an unsupported or damaged configuration encryption header instead
    of asking to update rclone.
  - rclone_config_encryption - say in the failure for a file that
    ``state=absent`` cannot decrypt without ``content`` that the encrypted
    payload may be damaged, besides the password being wrong or missing.
  - rclone_config_encryption - document under ``content`` that a file whose
    encrypted payload is damaged is replaced, while one with an unsupported
    encryption header fails.
  - rclone_config_encryption - name the configuration file in the failure
    message when neither pycryptodome nor pycryptodomex is installed, and name
    pycryptodomex there as well, since either library is accepted.
  - rclone_config_encryption - say in the check mode details that the
    configuration is not inspected when neither pycryptodome nor
    pycryptodomex is available.
  - rclone_obscure, rclone_deobscure - name pycryptodomex as well as
    pycryptodome in the failure when neither library is installed.
