---
bugfixes:
  - systemd_hostname - on systemd 247 and earlier, set ``transient_hostname``
    while the static hostname names the local host, such as ``localhost`` or
    ``localhost.localdomain``, as those versions apply the transient hostname
    then. The module failed saying that the static hostname takes precedence,
    which is true from systemd 248 only. Check mode also predicts that
    setting such a static hostname keeps the hostname in effect on those
    versions, and no longer predicts ``hostname_source``, which they do not
    report.
