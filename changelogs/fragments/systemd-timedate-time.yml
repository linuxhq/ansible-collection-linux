---
bugfixes:
  - systemd_timedate - fail before writing any setting when ``time`` is set
    after another setting while network time synchronization would stay
    enabled, or when an absolute ``time`` is at or before the epoch, instead
    of failing after earlier settings were applied. A ``time`` set first, or
    an ``ntp`` enabled first without a network time service, is refused by
    ``systemd-timedated`` before anything is changed.
  - systemd_timedate - set the clock before ``local_rtc`` unless ``ntp``
    changes or ``adjust_system_clock`` is set, so a ``time``
    ``systemd-timedated`` refuses, such as one before the systemd build date
    on systemd 258 and later, no longer leaves ``local_rtc`` written. The
    clock and the hardware clock end up as with the earlier order.
