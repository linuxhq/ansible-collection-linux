---
breaking_changes:
  - kopia_snapshot - fail before running kopia when a ``tags`` value is null,
    a Boolean, a list or a dictionary. Such values were recorded on the
    snapshot as Python text, such as ``None`` or ``True``, rather than the
    value written. Quote a Boolean, such as ``"true"``, to record it as text.
    Numbers are still accepted and recorded as Python writes them, so quote a
    value that YAML reads as a number whose text differs, such as ``1.10`` or
    ``12:30``, to record it as written.
