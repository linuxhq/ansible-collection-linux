---
breaking_changes:
  - kopia - the role now manages the repository, maintenance settings, policies
    and snapshots with the ``kopia_repository``, ``kopia_maintenance``,
    ``kopia_policy`` and ``kopia_snapshot`` modules instead of shelling out to
    the kopia CLI, so the variables that fed those commands take structured
    values rather than command line flags. ``kopia_repository`` becomes a dict
    of ``storage``, ``options`` and ``secrets`` in place of ``location`` and
    ``flags``; ``kopia_maintenance`` becomes a dict of settings in place of a
    list of flags; and each entry in ``kopia_policies`` carries a ``policy``
    dict in place of ``flags``.
  - kopia - ``kopia_server`` is removed and the server is always configured. The
    unit is always managed, while the service itself follows the repository. It
    is started and enabled once a repository is connected, and stopped and
    disabled when ``kopia_repository`` is empty or its state is V(absent), so a
    server is never left running against a repository it can no longer reach.
minor_changes:
  - kopia - add ``kopia_snapshot``, a boolean that defaults to V(false),
    controlling whether a snapshot is taken for each policy target on every run.
  - kopia - the repository password is passed to the modules rather than
    interpolated into a command line, so it no longer appears in the process
    table.
