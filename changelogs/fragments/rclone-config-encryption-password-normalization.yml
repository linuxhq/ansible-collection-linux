---
bugfixes:
  - rclone_config_encryption - accept an empty or whitespace-only
    ``password``, which was rejected with ``no characters in password``. It
    encrypts and decrypts consistently, but rclone itself refuses such a
    password, so rclone cannot open a file encrypted with one.
  - rclone_config_encryption - document that the password is NFKC
    normalized with the Unicode tables of the managed node's Python, and that
    rclone cannot open a file encrypted with a password holding a run of more
    than 30 combining characters, which rclone normalizes differently.
  - rclone_config_encryption - reject a ``password`` containing a lone
    surrogate code point, such as U+D800 from a JSON extra variable, with a
    message naming the configuration file. Such a password reported a change
    in check mode and failed with a traceback in a real run, and rclone refuses
    it as invalid UTF-8.
  - rclone_config_encryption - reject ``content`` containing a lone surrogate
    code point, such as U+D800 from a JSON extra variable, with a message
    naming the configuration file, instead of failing with a traceback.
