---
bugfixes:
  - rclone_config_encryption - reject a ``password`` whose compatibility
    decomposition has a run of more than 30 consecutive combining characters,
    marks or Hangul jamo, such as ``a`` followed by 31 U+0301 or 31 U+0B3E, or
    U+AC00 followed by 30 U+0301, because rclone inserts U+034F into such a run
    while normalizing the password and could not decrypt the file the module
    wrote. Such passwords were accepted before and are now refused before
    anything is read or written.
  - rclone_config_encryption - accept a ``password`` containing a Unicode
    noncharacter, such as U+FFFF, which the check for unassigned characters
    rejected although noncharacters normalize the same way in every Unicode
    version.
