---
bugfixes:
  - kopia_repository - compare a number given for an identifying storage
    option, such as ``bucket``, with the connected repository as the text
    passed to kopia, so a host connected to a different repository fails
    instead of reporting no change.
  - kopia_repository - fail before running kopia when a value in ``options``
    or ``secrets`` is a dictionary, which was passed to kopia as Python text,
    or when an option that identifies the repository, such as ``bucket`` or
    ``path``, is given a list, which was passed as one flag per element and
    not compared with the connected repository. kopia rejects a Boolean for
    these options, so quote a value such as ``no`` that YAML reads as a
    Boolean.
  - kopia_repository - compare the options that identify the repository with
    the connected repository also when they are given in ``secrets``, using
    the value sent to kopia, where ``secrets`` takes precedence over
    ``options``. A host connected elsewhere failed to be detected, and an
    option overridden by a secret made the next run fail against the
    module's own connection. A mismatch in a secret names only the option,
    not its value, and failure messages no longer show an option that a
    secret overrides.
  - kopia_repository - document that numbers in ``options`` and ``secrets``
    are passed to kopia as Python formats them, so values that YAML reads as
    numbers, such as an unquoted ``0755``, ``12:30`` or ``1.10``, should be
    quoted.
