---
- name: Prepare
  hosts: all
  tasks:
    # systemd-localed checks X11 layouts with libxkbcommon and refuses them without it
    - name: Ensure XKB packages are present
      tags:
        - systemd_locale
      become: true
      ansible.builtin.apt:
        cache_valid_time: 3600
        name: libxkbcommon0
        state: present
        update_cache: true
      when:
        - ansible_facts.os_family == 'Debian'

    - name: Ensure XKB packages are present
      tags:
        - systemd_locale
      become: true
      ansible.builtin.dnf:
        name: libxkbcommon
        state: present
      when:
        - ansible_facts.os_family == 'RedHat'
...
