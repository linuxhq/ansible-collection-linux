---
- name: Verify
  hosts: all
  roles:
    - kopia_snapshot_info

  post_tasks:
    - name: Ensure kopia information is verified
      tags:
        - kopia_snapshot_info
      ansible.builtin.assert:
        that:
          - _kopia_snapshot_info_list | length > 0
          - _kopia_snapshot_info_list | map(attribute='source.path') | unique == ['/home/vagrant']
...
