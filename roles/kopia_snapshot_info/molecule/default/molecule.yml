---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: vagrant

platforms:
  - name: almalinux9
    box: bento/almalinux-9.6
    box_architecture: arm64
    cpus: 4
    memory: 4096

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        kopia_password: molecule-kopia-pass

        kopia_repository:
          storage: filesystem
          options:
            path: /srv/kopia

        kopia_policies:
          - target: /home/vagrant
            policy:
              retention:
                keep_latest: 2

        kopia_snapshot_info_password: molecule-kopia-pass

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
  options:
    diff: true

...
