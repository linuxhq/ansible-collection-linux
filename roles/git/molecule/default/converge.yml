---
- name: Converge
  hosts: all
  pre_tasks:
    # https://access.redhat.com/solutions/7101587
    - name: Ensure openssh and openssl are upgraded
      tags:
        - git
      become: true
      ansible.builtin.dnf:
        name:
          - openssh
          - openssl
        state: latest
        update_only: true
      when:
        - ansible_facts.os_family == 'RedHat'

  roles:
    - git

    - role: git
      git_repositories:
        - repo: https://github.com/linuxhq/ansible-collection-aws.git
          dest: /usr/local/ansible-collection-aws
          become: true

        - repo: https://github.com/linuxhq/ansible-collection-linux.git
          dest: /home/vagrant/ansible-collection-linux

        - repo: https://github.com/linuxhq/ansible-collection-macos.git
          dest: /home/molecule/ansible-collection-macos
          become: true
          become_user: molecule
...
