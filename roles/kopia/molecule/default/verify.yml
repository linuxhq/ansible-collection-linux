---
- name: Verify
  hosts: all
  tasks:
    - name: Ensure kopia repository information is gathered
      tags:
        - kopia
      become: true
      linuxhq.linux.kopia_repository_info:
      register: __kopia_repository_query

    - name: Ensure kopia repository is verified
      tags:
        - kopia
      ansible.builtin.assert:
        that:
          - __kopia_repository_query.connected
          - __kopia_repository_query.repository.storage.type == kopia_repository.storage
          - __kopia_repository_query.repository.storage.config.path ==
            kopia_repository.options.path

    - name: Ensure kopia maintenance information is gathered
      tags:
        - kopia
      become: true
      linuxhq.linux.kopia_maintenance_info:
      register: __kopia_maintenance_query

    - name: Ensure kopia maintenance settings are verified
      tags:
        - kopia
      vars:
        __kopia_client: "{{ __kopia_repository_query.repository.client_options }}"
        __kopia_maintenance: "{{ __kopia_maintenance_query.maintenance }}"
      ansible.builtin.assert:
        that:
          - __kopia_maintenance.full.enabled
          - __kopia_maintenance.quick.enabled
          - __kopia_maintenance.full.interval ==
            kopia_maintenance.full_interval * 1000000000
          - __kopia_maintenance.quick.interval ==
            kopia_maintenance.quick_interval * 1000000000
          - __kopia_maintenance.extend_object_locks
          - __kopia_maintenance.list_parallelism ==
            kopia_maintenance.list_parallelism
          - __kopia_maintenance.log_retention.max_age == 0
          - __kopia_maintenance.log_retention.max_count ==
            kopia_maintenance.max_retained_log_count
          - __kopia_maintenance.log_retention.max_total_size == 0
          - __kopia_maintenance.owner ==
            __kopia_client.username ~ '@' ~ __kopia_client.hostname

    - name: Ensure kopia maintenance log retention needing two commands is set
      tags:
        - kopia
      become: true
      linuxhq.linux.kopia_maintenance:
        max_retained_log_age: 60
        max_retained_log_count: 0
      register: __kopia_maintenance_result

    - name: Ensure kopia maintenance log retention needing two commands is set again
      tags:
        - kopia
      become: true
      linuxhq.linux.kopia_maintenance:
        max_retained_log_age: 60
        max_retained_log_count: 0
      register: __kopia_maintenance_rerun_result

    - name: Ensure kopia maintenance log retention needing two commands is verified
      tags:
        - kopia
      vars:
        __kopia_log_retention: "{{ __kopia_maintenance_rerun_result.maintenance.log_retention }}"
      ansible.builtin.assert:
        that:
          - __kopia_maintenance_result.changed
          - not __kopia_maintenance_rerun_result.changed
          - __kopia_maintenance_result.maintenance.log_retention ==
            __kopia_log_retention
          - __kopia_log_retention.max_age == 60000000000
          - __kopia_log_retention.max_count == 0
          - __kopia_log_retention.max_total_size == 0

    - name: Ensure kopia policy information is gathered
      tags:
        - kopia
      become: true
      linuxhq.linux.kopia_policy_info:
        target: "{{ kopia_policies[0].target }}"
      register: __kopia_policy_query

    - name: Ensure kopia policy is verified
      tags:
        - kopia
      vars:
        __kopia_policy: "{{ __kopia_policy_query.effective_policy }}"
      ansible.builtin.assert:
        that:
          - __kopia_policy_query.defined
          - __kopia_policy.compression.compressor_name == 'gzip'
          - "'*.log' in __kopia_policy.files.ignore"
          - "'*.tmp' in __kopia_policy.files.ignore"
          - "'.cache/' in __kopia_policy.files.ignore"
          - __kopia_policy.retention.ignore_identical_snapshots
          - __kopia_policy.retention.keep_hourly == 24
          - __kopia_policy.retention.keep_latest == 2
          - __kopia_policy.retention.keep_monthly == 3
          - __kopia_policy.retention.keep_weekly == 4
          - __kopia_policy.scheduling.interval_seconds == 3600

    - name: Ensure kopia removed policy information is gathered
      tags:
        - kopia
      become: true
      linuxhq.linux.kopia_policy_info:
        target: "{{ kopia_policies[1].target }}"
      register: __kopia_absent_policy_query

    - name: Ensure kopia removed policy is verified
      tags:
        - kopia
      ansible.builtin.assert:
        that:
          - kopia_policies[1].state == 'absent'
          - not __kopia_absent_policy_query.defined
          - __kopia_absent_policy_query.policy == {}

    - name: Ensure kopia snapshot is created
      tags:
        - kopia
      become: true
      linuxhq.linux.kopia_snapshot:
        password: "{{ kopia_password }}"
        path: "{{ kopia_policies[0].target }}"
      register: __kopia_snapshot_result

    - name: Ensure kopia snapshot creation is verified
      tags:
        - kopia
      ansible.builtin.assert:
        that:
          - __kopia_snapshot_result.changed
          - __kopia_snapshot_result.snapshot.id | length == 32
          - __kopia_snapshot_result.snapshot.source.path ==
            kopia_policies[0].target

    - name: Ensure identical kopia snapshot is skipped
      tags:
        - kopia
      become: true
      linuxhq.linux.kopia_snapshot:
        password: "{{ kopia_password }}"
        path: "{{ kopia_policies[0].target }}"
      register: __kopia_identical_snapshot_result

    - name: Ensure identical kopia snapshot skip is verified
      tags:
        - kopia
      ansible.builtin.assert:
        that:
          - not __kopia_identical_snapshot_result.changed
          - __kopia_identical_snapshot_result.snapshot.id ==
            __kopia_snapshot_result.snapshot.id
          - __kopia_identical_snapshot_result.snapshot.source.path ==
            kopia_policies[0].target

    - name: Ensure kopia snapshot information is gathered
      tags:
        - kopia
      become: true
      linuxhq.linux.kopia_snapshot_info:
        path: "{{ kopia_policies[0].target }}"
      register: __kopia_snapshot_query

    - name: Ensure kopia snapshots are verified
      tags:
        - kopia
      ansible.builtin.assert:
        that:
          - __kopia_snapshot_query.snapshots | length > 0
          - __kopia_snapshot_query.snapshots[-1].source.path ==
            kopia_policies[0].target

    - name: Ensure kopia service information is gathered
      tags:
        - kopia
      ansible.builtin.service_facts:

    - name: Ensure kopia service information is verified
      tags:
        - kopia
      ansible.builtin.assert:
        that:
          - services['kopia.service'] is defined
          - services['kopia.service'].state  == 'running'
          - services['kopia.service'].status == 'enabled'
...
