---
- name: Ensure systemd locale packages are present
  tags:
    - systemd_locale_info
  become: true
  ansible.builtin.apt:
    cache_valid_time: 3600
    name: "{{ systemd_locale_info_packages }}"
    state: present
    update_cache: true
  when:
    - ansible_facts.os_family == 'Debian'

- name: Ensure systemd locale packages are present
  tags:
    - systemd_locale_info
  become: true
  ansible.builtin.dnf:
    name: "{{ systemd_locale_info_packages }}"
    state: present
  when:
    - ansible_facts.os_family == 'RedHat'

- name: Ensure systemd locale information is gathered
  tags:
    - systemd_locale_info
  linuxhq.linux.systemd_locale_info:
  register: __systemd_locale_info_query

- name: Ensure systemd locale facts are generated
  tags:
    - systemd_locale_info
  ansible.builtin.set_fact:
    _systemd_locale_info_dict:
      "{{ __systemd_locale_info_query.locale | d({}) }}"
...
