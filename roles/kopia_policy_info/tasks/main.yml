---
- name: Ensure kopia policy information is gathered
  tags:
    - kopia_policy_info
  become: true
  linuxhq.linux.kopia_policy_info:
    config_file: "{{ kopia_policy_info_config_file if kopia_policy_info_config_file is not none else omit }}"
    target: "{{ kopia_policy_info_target if kopia_policy_info_target is not none else omit }}"
  register: __kopia_policy_info_query

- name: Ensure kopia policy facts are generated
  tags:
    - kopia_policy_info
  ansible.builtin.set_fact:
    _kopia_policy_info_defined:
      "{{ __kopia_policy_info_query.defined | d(false) }}"
    _kopia_policy_info_effective_policy:
      "{{ __kopia_policy_info_query.effective_policy | d({}) }}"
    _kopia_policy_info_list:
      "{{ __kopia_policy_info_query.policies | d([]) }}"
    _kopia_policy_info_policy:
      "{{ __kopia_policy_info_query.policy | d({}) }}"
...
