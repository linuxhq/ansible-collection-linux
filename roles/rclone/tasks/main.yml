---
- name: Ensure rclone packages are present
  tags:
    - rclone
  become: true
  ansible.builtin.dnf:
    name:
      - fuse3
      - python3-pycryptodomex
      - rclone
    state: present
    validate_certs: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure rclone directory is present
  tags:
    - rclone
  become: true
  become_user: "{{ rclone_user }}"
  ansible.builtin.file:
    mode: '0700'
    path: ~/.config/rclone
    state: directory

- name: Ensure rclone configuration file is managed
  tags:
    - rclone
  become: true
  become_user: "{{ rclone_user }}"
  no_log: "{{ rclone_no_log }}"
  linuxhq.linux.rclone_config_encryption:
    content:
      "{{ lookup('ansible.builtin.template', 'rclone.conf.j2') | d('', true) }}"
    mode: '0600'
    password: "{{ rclone_config_pass | d(omit) }}"
    path: ~/.config/rclone/rclone.conf
    state: "{{ 'present' if rclone_config_pass is not none else 'absent' }}"
...
