---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: vagrant

platforms:
  - name: almalinux9
    box: bento/almalinux-9.6
    box_architecture: arm64
    cpus: 4
    memory: 4096

  - name: almalinux10
    box: bento/almalinux-10.0
    box_architecture: arm64
    cpus: 4
    memory: 4096

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        rclone_config:
          - name: source
            type: local
            nounc: true
          - name: backup
            type: alias
            remote: source:/srv
          - name: secret
            type: crypt
            remote: source:/srv/rclone
            password: txj-ko0iBZ-IYEGLKgWmdUTa0SJwGGFUrPpqI7pTMQRBNy8

        rclone_config_pass: molecule-config-pass
        rclone_config_path: /etc/rclone/rclone.conf

        rclone_mounts:
          - name: rclone-backup
            remote: 'backup:'
            mountpoint: /mnt/backup
            flags:
              - --read-only

        rclone_profile:
          rclone_progress: true
          rclone_verbose: 1

        rclone_sysconfig:
          rclone_allow_other: true
          rclone_read_only: true

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
