---
selinux_booleans: []
selinux_conf: /etc/selinux/config
selinux_fcontexts: []
selinux_packages:
  - python3-libselinux
  - python3-libsemanage
  - python3-policycoreutils
  - selinux-policy
selinux_policy: targeted
selinux_reboot: false
selinux_reboot_timeout: 600
selinux_restorecon: []
selinux_state: enforcing
selinux_update_kernel_param: false
...
