---
- name: Converge
  hosts: all
  roles:
    - role: selinux
      selinux_reboot: true
      selinux_state: disabled
      tags:
        - molecule-idempotence-notest

    - role: selinux
      selinux_booleans:
        - name: container_use_devices
          state: true
      selinux_reboot: true
      selinux_state: enforcing
...
